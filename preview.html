    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Top Control Bar */

      background: #1e293b;

      align-items: center;
      justify-content: space-between;

      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;

      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 280px;

    /* Device Switcher */
    .device-switcher {
      display: flex;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;

      gap: 8px;
      background: rgba(255,255,255,0.06);

      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);

      color: white;
      padding: 6px 10px;
      border-radius: 6px;

      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;

      align-items: center;
      justify-content: center;
      background: #090e17;
      padding: 20px;
      overflow: hidden;
      position: relative;

      width: 100%;
      height: 100%;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .nav-arrow {

    let currentIndex = 0;

    const selectEl = document.getElementById('templateSelect');
    templates.forEach((t, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `Template #${t.n} — ${t.doctor} (${t.specialty})`;
      selectEl.appendChild(opt);
    });

    // Parse URL param
    const urlParams = new URLSearchParams(window.location.search);
    const paramT = urlParams.get('template') || urlParams.get('t') || urlParams.get('id');
    if (paramT) {
      const foundIdx = templates.findIndex(item => item.n === paramT || parseInt(item.n, 10) === parseInt(paramT, 10) || item.n === String(paramT).padStart(3, '0'));
      if (foundIdx !== -1) currentIndex = foundIdx;
    }

    function loadTemplate(idx) {
      currentIndex = idx;
      selectEl.value = idx;
      const t = templates[idx];
      const frame = document.getElementById('previewFrame');
      frame.src = t.path;
      document.getElementById('waOrderBtn').href = `https://wa.me/8801609977377?text=Hello!%20I%20am%20interested%20in%20Template%20%23${t.n}%20(${encodeURIComponent(t.doctor)}%20-%20${encodeURIComponent(t.specialty)})`;
      
      // Re-apply customization after frame loads
      frame.onload = () => {
        applyCustomName();
      };
    }

    function changeTemplate(val) {
      loadTemplate(parseInt(val));
    }

    function nextTemplate() {
      const next = (currentIndex + 1) % templates.length;
      loadTemplate(next);
    }

    function prevTemplate() {
      const prev = (currentIndex - 1 + templates.length) % templates.length;
      loadTemplate(prev);
    }

    function setDevice(device) {
      const wrap = document.getElementById('iframeWrap');
      wrap.className = 'iframe-wrapper ' + device;
      document.querySelectorAll('.btn-device').forEach(btn => btn.classList.remove('active'));
      if (device === 'desktop') document.getElementById('btnDesktop').classList.add('active');
      if (device === 'tablet') document.getElementById('btnTablet').classList.add('active');
      if (device === 'mobile') document.getElementById('btnMobile').classList.add('active');
    }

    function applyCustomName() {
      const name = document.getElementById('custName').value;
      const spec = document.getElementById('custSpec').value;
      const frame = document.getElementById('previewFrame');
      if (frame.contentWindow) {
        frame.contentWindow.postMessage({
          type: 'CUSTOMIZE_DOCTOR',
          name: name,
          specialty: spec
        }, '*');
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextTemplate();
      if (e.key === 'ArrowLeft') prevTemplate();
    });

    // Initialize
    loadTemplate(currentIndex);
  </script>
