<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors Portfolio — Live Interactive Template Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --wa-green: #25D366;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Top Control Bar */
    .top-bar {
      height: 68px;
      background: #1e293b;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
      flex-shrink: 0;
    }

    .top-bar-left { display: flex; align-items: center; gap: 16px; }
    .btn-back {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.15); }

    .template-selector {
      background: #0f172a;
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 280px;
    }

    /* Device Switcher */
    .device-switcher {
      display: flex;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .btn-device {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-device:hover { color: white; }
    .btn-device.active { background: var(--accent); color: white; }

    /* Live Doctor Name Customizer */
    .customizer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .cust-input {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
      width: 150px;
    }
    .cust-input:focus { border-color: var(--accent); }

    .btn-cta-whatsapp {
      background: var(--wa-green);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-cta-whatsapp:hover { background: #128c7e; transform: translateY(-1px); }

    /* Main Preview Stage */
    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090e17;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .iframe-wrapper.desktop { width: 100%; height: 100%; }
    .iframe-wrapper.tablet { width: 768px; height: 95%; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border-radius: 24px; border: 12px solid #1e293b; overflow: hidden; }
    .iframe-wrapper.mobile { width: 390px; height: 95%; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border-radius: 36px; border: 12px solid #1e293b; overflow: hidden; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    /* Floating Navigation Controls */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(30, 41, 59, 0.8);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .nav-arrow:hover { background: var(--accent); }
    .nav-arrow.prev { left: 24px; }
    .nav-arrow.next { right: 24px; }
  </style>
</head>
<body>

    <!-- WhatsApp Pitch CTA -->
    <a href="https://wa.me/8801609977377?text=Hello!%20I%20want%20to%20order%20this%20doctor%20portfolio%20website" target="_blank" class="btn-cta-whatsapp" id="waOrderBtn">

    <button class="nav-arrow next" onclick="nextTemplate()">&rarr;</button>

    <div class="iframe-wrapper desktop" id="iframeWrap">
      <iframe id="previewFrame" src="templates/template-001.html"></iframe>
    </div>
  </div>

    let currentIndex = 0;

    const selectEl = document.getElementById('templateSelect');
    templates.forEach((t, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `Template #${t.n} — ${t.doctor} (${t.specialty})`;
      selectEl.appendChild(opt);
    });

    // Parse URL param
    const urlParams = new URLSearchParams(window.location.search);
    const paramT = urlParams.get('template') || urlParams.get('t') || urlParams.get('id');
    if (paramT) {
      const foundIdx = templates.findIndex(item => item.n === paramT || parseInt(item.n, 10) === parseInt(paramT, 10) || item.n === String(paramT).padStart(3, '0'));
      if (foundIdx !== -1) currentIndex = foundIdx;
    }

    function loadTemplate(idx) {
      currentIndex = idx;
      selectEl.value = idx;
      const t = templates[idx];
      const frame = document.getElementById('previewFrame');
      frame.src = t.path;
      document.getElementById('waOrderBtn').href = `https://wa.me/8801609977377?text=Hello!%20I%20am%20interested%20in%20Template%20%23${t.n}%20(${encodeURIComponent(t.doctor)}%20-%20${encodeURIComponent(t.specialty)})`;
      
      // Re-apply customization after frame loads
      frame.onload = () => {
        applyCustomName();
      };
    }

    function changeTemplate(val) {
      loadTemplate(parseInt(val));
    }

    function nextTemplate() {
      const next = (currentIndex + 1) % templates.length;
      loadTemplate(next);
    }

    function prevTemplate() {
      const prev = (currentIndex - 1 + templates.length) % templates.length;
      loadTemplate(prev);
    }

    function setDevice(device) {
      const wrap = document.getElementById('iframeWrap');
      wrap.className = 'iframe-wrapper ' + device;
      document.querySelectorAll('.btn-device').forEach(btn => btn.classList.remove('active'));
      if (device === 'desktop') document.getElementById('btnDesktop').classList.add('active');
      if (device === 'tablet') document.getElementById('btnTablet').classList.add('active');
      if (device === 'mobile') document.getElementById('btnMobile').classList.add('active');
    }

    function applyCustomName() {
      const name = document.getElementById('custName').value;
      const spec = document.getElementById('custSpec').value;
      const frame = document.getElementById('previewFrame');
      if (frame.contentWindow) {
        frame.contentWindow.postMessage({
          type: 'CUSTOMIZE_DOCTOR',
          name: name,
          specialty: spec
        }, '*');
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextTemplate();
      if (e.key === 'ArrowLeft') prevTemplate();
    });

    // Initialize
    loadTemplate(currentIndex);
  </script>
